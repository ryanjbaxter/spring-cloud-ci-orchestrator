name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, no leading v. Blank = derive from the pom (0.1.0-SNAPSHOT -> 0.1.0).'
        required: false
        type: string
      next_version:
        description: 'Next dev version, without -SNAPSHOT. Blank = auto-derive.'
        required: false
        type: string
      dry_run:
        description: 'Dry run, build and validate everything, but push and publish nothing'
        required: false
        type: boolean
        default: false

permissions:
  # contents: git push (commit + tag) and `gh release create`.
  # issues:   milestones are part of the Issues API - needed to move issues and
  #           open/close milestones.
  contents: write
  issues: write

concurrency:
  # One release at a time. cancel-in-progress MUST stay false - cancelling a release
  # midway is exactly the half-published state this workflow is ordered to prevent.
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Hardcoded deliberately: the repo is named spring-cloud-ci-orchestrator but the
  # artifactId is ci-release-orchestrator, so github.event.repository.name is WRONG here.
  ARTIFACT_ID: ci-release-orchestrator
  # Fully-qualified and pinned. Invoking the bare `versions:set` prefix makes Maven
  # resolve whatever mojohaus released most recently, so the build would not be
  # reproducible and the version would drift underneath us.
  VERSIONS_PLUGIN: org.codehaus.mojo:versions-maven-plugin:2.21.0
  # Same reasoning: pinned so `help:evaluate` can't drift underneath the release.
  HELP_PLUGIN: org.apache.maven.plugins:maven-help-plugin:3.5.2

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Refuse to release from anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release must be run from main; got ${{ github.ref }}"
          exit 1

      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0            # full history for the tag preflight
          persist-credentials: true # we need the token in .git/config to push

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve and validate versions
        id: v
        env:
          # Inputs go through env, never interpolated into the script body. `${{ }}` is
          # substituted textually before bash parses the script, so inlining an input is
          # a shell-injection sink.
          IN_VERSION: ${{ inputs.version }}
          IN_NEXT: ${{ inputs.next_version }}
        run: |
          set -euo pipefail
          if [[ -n "${IN_VERSION// /}" ]]; then
            version="${IN_VERSION#v}"
            version="${version// /}"
            source_note="explicit input"
          else
            # Derive the way maven-release-plugin does: 0.1.0-SNAPSHOT -> 0.1.0.
            # Capture stdout ONLY - the JVM writes warnings to stderr, and merging
            # them would corrupt the version string.
            pom_version=$(./mvnw -q "${HELP_PLUGIN}:evaluate" \
                            -Dexpression=project.version -DforceStdout 2>/dev/null)
            pom_version="${pom_version//[[:space:]]/}"
            if [[ "$pom_version" != *-SNAPSHOT ]]; then
              echo "::error::pom version '$pom_version' is not a -SNAPSHOT, so there is"
              echo "::error::nothing to release. Pass an explicit version input instead."
              exit 1
            fi
            version="${pom_version%-SNAPSHOT}"
            source_note="pom ($pom_version)"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(M|RC)[0-9]+)?$ ]]; then
            echo "::error::'$version' is not a valid release version."
            echo "::error::Expected X.Y.Z, or X.Y.Z-M<n> / X.Y.Z-RC<n>. Never -SNAPSHOT."
            exit 1
          fi

          tag="v$version"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true

          if [[ -n "${IN_NEXT}" ]]; then
            next="${IN_NEXT#v}"
            next="${next%-SNAPSHOT}"
            if [[ ! "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::next_version '$IN_NEXT' must be plain X.Y.Z"
              exit 1
            fi
          elif [[ "$version" == *-* ]]; then
            # 1.0.0-RC1 -> stay on 1.0.0-SNAPSHOT; more RCs and then GA follow off that base.
            next="${version%%-*}"
          else
            # 0.1.0 -> 0.1.1-SNAPSHOT
            IFS=. read -r maj min pat <<<"$version"
            next="$maj.$min.$((pat + 1))"
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "next_snapshot=$next-SNAPSHOT"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing $version (from $source_note) as $tag; next development version $next-SNAPSHOT"

      - name: Preflight - tag and release must not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG already exists on origin. Refusing to re-release."
            exit 1
          fi
          # Catches a draft release that has no tag yet, which ls-remote misses entirely.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::a GitHub Release named $TAG already exists."
            exit 1
          fi
          # Catches someone pushing to main between clicking Run and the runner starting.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::checked-out commit is not the tip of origin/main. Re-run the workflow."
            exit 1
          fi

      - name: Preflight - the release milestone must exist and be open
        id: ms
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          # jq reads VERSION from the environment, which sidesteps quoting the title
          # into the filter.
          number=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/milestones?state=open&per_page=100" \
                     --jq '.[] | select(.title == env.VERSION) | .number' | head -1)
          if [ -z "$number" ]; then
            echo "::error::no OPEN milestone titled '$VERSION'."
            echo "::error::Create it (or reopen it) before releasing this version."
            exit 1
          fi
          echo "milestone=$number" >> "$GITHUB_OUTPUT"
          echo "Found open milestone '$VERSION' (#$number)"

      - name: Set the pom to the release version
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          ./mvnw --batch-mode --no-transfer-progress "${VERSIONS_PLUGIN}:set" \
            -DnewVersion="$VERSION" \
            -DgenerateBackupPoms=false
          git --no-pager diff --stat pom.xml

      - name: Build and test at the release version
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Verify the release artifact
        id: art
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          jar="target/${ARTIFACT_ID}-${VERSION}.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::$jar was not produced"; ls -la target; exit 1
          fi
          # Cross-check the glob against the constructed name so a stray extra jar can
          # never silently become the published asset.
          shopt -s nullglob
          jars=(target/*.jar)
          if [ "${#jars[@]}" -ne 1 ] || [ "${jars[0]}" != "$jar" ]; then
            echo "::error::unexpected jars in target/: ${jars[*]}"; exit 1
          fi
          # Absence of .jar.original means repackage never ran and we are about to
          # publish the ~50KB thin jar. This is the genuinely catastrophic outcome.
          if [ ! -f "${jar}.original" ]; then
            echo "::error::no ${jar}.original - spring-boot repackage did not run"; exit 1
          fi

          manifest=$(unzip -p "$jar" META-INF/MANIFEST.MF)
          grep -q '^Main-Class: org.springframework.boot.loader.launch.JarLauncher' <<<"$manifest"

          out=$(java -jar "$jar" --help)
          grep -q -- '--release-train-version' <<<"$out"

          echo "jar=$jar" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 checksum
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          # cd first so the checksum file records the bare filename. `sha256sum target/x.jar`
          # records the path "target/x.jar", and `sha256sum -c` then fails for downloaders.
          cd target
          sha256sum "${ARTIFACT_ID}-${VERSION}.jar" > "${ARTIFACT_ID}-${VERSION}.jar.sha256"
          sha256sum -c "${ARTIFACT_ID}-${VERSION}.jar.sha256"
          cat "${ARTIFACT_ID}-${VERSION}.jar.sha256"

      - name: Commit the release version and create the tag
        env:
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pom.xml
          git commit -m "Release $VERSION"
          git tag -a "$TAG" -m "Release $VERSION"

      # ---- Everything above is local to the runner. Nothing has left it yet. ----

      - name: Push the release commit and tag atomically
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          # --atomic: both refs land or neither does. Without it you can end up with a
          # tag on origin pointing at a commit that never made it to main.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"

      - name: Create the GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          JAR: ${{ steps.art.outputs.jar }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(release create "$TAG"
                --title "$TAG"
                --verify-tag
                --generate-notes)
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          gh "${args[@]}" "$JAR" "$JAR.sha256"

      - name: Roll the milestone forward
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          NEXT_SNAPSHOT: ${{ steps.v.outputs.next_snapshot }}
          OLD_MS: ${{ steps.ms.outputs.milestone }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          # Milestones track released versions, so the next one is named for the version
          # the new snapshot will become: 0.1.1-SNAPSHOT -> milestone "0.1.1".
          export NEXT_TITLE="${NEXT_SNAPSHOT%-SNAPSHOT}"

          # Reuse rather than duplicate if someone already created it by hand.
          next_ms=$(gh api --paginate "repos/$repo/milestones?state=all&per_page=100" \
                      --jq '.[] | select(.title == env.NEXT_TITLE) | .number' | head -1)
          if [ -z "$next_ms" ]; then
            next_ms=$(gh api -X POST "repos/$repo/milestones" -f title="$NEXT_TITLE" --jq '.number')
            echo "created milestone $NEXT_TITLE (#$next_ms)"
          else
            echo "reusing existing milestone $NEXT_TITLE (#$next_ms)"
          fi

          # Carry anything still open forward, so nothing is orphaned on a closed
          # milestone. This endpoint returns PRs as well as issues, which is what we want.
          moved=0
          while read -r n; do
            [ -n "$n" ] || continue
            gh api -X PATCH "repos/$repo/issues/$n" -F milestone="$next_ms" >/dev/null
            echo "  moved #$n -> $NEXT_TITLE"
            moved=$((moved + 1))
          done < <(gh api --paginate "repos/$repo/issues?milestone=${OLD_MS}&state=open&per_page=100" \
                     --jq '.[].number')

          gh api -X PATCH "repos/$repo/milestones/${OLD_MS}" -f state=closed >/dev/null
          echo "closed milestone $VERSION (#$OLD_MS); carried $moved open item(s) forward"
          echo "MILESTONE_MOVED=$moved" >> "$GITHUB_ENV"
          echo "MILESTONE_NEXT=$NEXT_TITLE" >> "$GITHUB_ENV"

      - name: Bump to the next development version
        if: ${{ !inputs.dry_run }}
        env:
          NEXT_SNAPSHOT: ${{ steps.v.outputs.next_snapshot }}
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress "${VERSIONS_PLUGIN}:set" \
            -DnewVersion="$NEXT_SNAPSHOT" \
            -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "Next development version $NEXT_SNAPSHOT"
          git push origin HEAD:refs/heads/main

      - name: Summary
        if: success()
        env:
          TAG: ${{ steps.v.outputs.tag }}
          NEXT_SNAPSHOT: ${{ steps.v.outputs.next_snapshot }}
          TAG_VERSION: ${{ steps.v.outputs.version }}
          DRY: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Release $TAG"
            echo ""
            echo "- dry run: \`$DRY\`"
            echo "- next development version: \`$NEXT_SNAPSHOT\`"
            if [ "$DRY" != "true" ]; then
              echo "- milestone \`$TAG_VERSION\` closed; \`${MILESTONE_NEXT:-?}\` opened (\`${MILESTONE_MOVED:-0}\` item(s) carried forward)"
            fi
            if [ "$DRY" != "true" ]; then
              echo "- https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Recovery instructions
        if: failure()
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          {
            echo "### Release failed"
            echo ""
            echo "If this failed before the atomic push, origin is untouched - just re-run."
            echo ""
            echo "If the push succeeded but a later step failed, undo before retrying:"
            echo ""
            echo '```'
            echo "gh release delete ${TAG:-vX.Y.Z} --yes --cleanup-tag  # if the release exists"
            echo "git push --delete origin ${TAG:-vX.Y.Z}              # if only the tag exists"
            echo "git push --force-with-lease origin <sha-before-release>:main"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
